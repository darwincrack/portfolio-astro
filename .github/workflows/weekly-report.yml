# Informe semanal de Search Console y Google Analytics por correo.
# Lunes a las 8:00, hora de Venezuela (12:00 UTC). También se puede lanzar a mano.
name: Informe semanal

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/weekly-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node report.mjs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
